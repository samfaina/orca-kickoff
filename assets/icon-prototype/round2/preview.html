<!doctype html>
<!-- PROTOTYPE (#71), throwaway. Round 2: I-B in indigo, the glyph at 100, 85 and 72% on a flat, a soft-gradient and
     a strong-gradient background, at 128, 32 and 20 px beside the name, on light and dark. Run export.ps1 first. -->
<html>
<head>
<meta charset="utf-8">
<title>Kickoff icon, round 2</title>
<style>
  body { margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; background: #fff; color: #111; }
  table { border-collapse: collapse; margin: 8px 16px; }
  th { font-weight: 600; text-align: left; padding: 8px 12px; white-space: nowrap; }
  td { padding: 10px 12px; vertical-align: middle; }
  .light { background: #f5f5f5; color: #111; }
  .dark { background: #1e1e1e; color: #eee; }
  .row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  img { display: block; }
</style>
</head>
<body>
<table><thead id="head"></thead><tbody id="rows"></tbody></table>
<script>
  const backgrounds = ['flat', 'soft', 'strong'];
  const scales = ['100', '85', '72'];
  document.getElementById('head').innerHTML = '<tr><th></th>' + ['light', 'dark'].map(theme =>
    `<th class="${theme}">128</th><th class="${theme}">32</th><th class="${theme}">Beside the name</th>`).join('') + '</tr>';
  document.getElementById('rows').innerHTML = backgrounds.flatMap(bg => scales.map(scale => {
    const src = `out/b-${bg}-${scale}.png`;
    return `<tr><th>${bg}, ${scale}%</th>` + ['light', 'dark'].map(theme => `
      <td class="${theme}"><img src="${src}" width="128" height="128"></td>
      <td class="${theme}"><img src="${src}" width="32" height="32"></td>
      <td class="${theme}"><div class="row"><img src="${src}" width="20" height="20">Kickoff</div></td>`).join('') + '</tr>';
  })).join('');
</script>
</body>
</html>
